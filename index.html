<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ChamaFix</title>
        <link rel="icon" href="assets/logo.png">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body class="pagina-index">
        <main class="welcome-page">
            <section class="brand-panel">
                <div class="brand-lockup">
                    <img class="brand-lockup__symbol" src="assets/logo.png" alt="Logo ChamaFix">
                    <h1 class="brand-lockup__name"><span>Chama</span><span>Fix</span></h1>
                </div>
            </section>

            <section class="welcome-content">
                <div class="welcome-copy">
                    <h2>Bem-vindo!</h2>
                    <p>Esta página vai ajudar você a encontrar seu serviço</p>
                </div>

                <div class="profile-options">
                    <a class="profile-option" id="btn-cliente" href="cliente.html">
                        <span class="profile-option__card">
                            <img class="profile-option__icon profile-option__icon--client" src="assets/usuario.png" alt="">
                        </span>
                        <span class="profile-option__label">Sou Cliente</span>
                    </a>
                    <a class="profile-option" id="btn-prestador" href="dashboard.html">
                        <span class="profile-option__card">
                            <img class="profile-option__icon profile-option__icon--provider" src="assets/chave-de-fenda.png" alt="">
                        </span>
                        <span class="profile-option__label">Sou Prestador</span>
                    </a>
                </div>
            </section>
        </main>
        <script src="js/login.js"></script>
    </body>
</html>
